app-id: com.ancientkira.rufuswift
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: rufuswift

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --device=all
  - --filesystem=host

modules:
  - name: rufuswift
    buildsystem: simple
    build-commands:
      - swift build -c release
      - install -D -m 755 .build/release/Rufus /app/bin/rufuswift
      - install -D -m 644 packaging/linux/com.ancientkira.rufuswift.desktop /app/share/applications/com.ancientkira.rufuswift.desktop
      - install -D -m 644 packaging/linux/com.ancientkira.rufuswift.metainfo.xml /app/share/metainfo/com.ancientkira.rufuswift.metainfo.xml
      - install -D -m 644 res/icons/rufus-512.png /app/share/icons/hicolor/512x512/apps/com.ancientkira.rufuswift.png
    sources:
      - type: dir
        path: ../../
